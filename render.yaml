services:
  - type: web
    name: porchlight-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: COST_CAP_USD
        value: "40"
      - key: META_API_BASE
        value: https://api.meta.ai/v1
      - key: PRICE_VOICE_PER_MIN
        value: "0.003"
