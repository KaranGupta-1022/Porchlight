services:
  - type: web
    name: porchlight-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: AI_MODE
        value: mock
      - key: COST_CAP_USD
        value: "40"
      - key: META_API_BASE
        value: https://api.meta.ai/v1
      - key: MUSE_SPARK_MODEL
        value: muse-spark-1.3-contributor
      - key: PRICE_IN_PER_M
        value: "0.10"
      - key: PRICE_OUT_PER_M
        value: "0.20"
      - key: PRICE_VOICE_PER_MIN
        value: "0.003"
